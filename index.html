<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A study timer, daily study hours, and brown noise.">
    <title>Workflow</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <h1><a class="brand" href="./">workflow</a></h1>
        <div class="date" id="date"></div>
      </header>
      <main>
        <section class="timer-panel" aria-labelledby="timer-heading">
          <div class="panel-top">
            <h2 id="timer-heading">Session</h2>
            <span class="status" id="timer-status">Idle</span>
          </div>
          <div class="timer-center">
            <label class="sr-only" for="session-title">Session title</label>
            <input id="session-title" class="session-title" type="text" maxlength="80" placeholder="Session title, e.g. MATH135" autocomplete="off" spellcheck="false">
            <div class="timer" id="timer" role="timer" aria-label="Current study session">00:00<span>:00</span></div>
            <div class="timer-actions">
              <button class="primary" id="timer-toggle">Start</button>
              <button class="secondary" id="timer-finish" disabled>Finish</button>
            </div>
          </div>
          <p class="timer-note">Keeps counting until paused, even if you close this tab.</p>
        </section>
        <section class="sound-panel" aria-labelledby="sound-heading">
          <h2 id="sound-heading">Brown noise</h2>
          <div class="volume-control">
            <label for="volume">Volume</label>
            <input id="volume" type="range" min="0" max="100" value="30">
            <output id="volume-value" for="volume">30%</output>
          </div>
          <button class="secondary sound-toggle" id="sound-toggle" aria-label="Play brown noise" aria-pressed="false">Play</button>
          <p class="sound-note" id="sound-note" role="status"></p>
        </section>
        <section class="history-panel" aria-labelledby="history-heading">
          <div class="history-top">
            <h2 id="history-heading">Study hours</h2>
            <div class="week-nav">
              <button id="previous-week" aria-label="Previous seven days">←</button>
              <span id="week-range"></span>
              <button id="next-week" aria-label="Next seven days">→</button>
            </div>
          </div>
          <div class="history-content">
            <div class="today-total">
              <p>Today</p>
              <div class="hours"><strong id="today-hours">0.00</strong><span>h</span></div>
              <div class="week-total"><span>Last 7 days</span><strong id="week-hours">0.00 h</strong></div>
            </div>
            <div class="chart-wrap">
              <div class="chart" id="chart" role="img" aria-label="Daily study hours for the last seven days"></div>
              <table class="sr-only">
                <caption>Daily study totals</caption>
                <thead><tr><th scope="col">Date</th><th scope="col">Study time</th></tr></thead>
                <tbody id="daily-totals"></tbody>
              </table>
            </div>
          </div>
        </section>
        <p class="storage-warning" id="storage-warning" role="alert" hidden></p>
      </main>
      <footer>History is saved in this browser.</footer>
    </div>
  </body>
</html>
